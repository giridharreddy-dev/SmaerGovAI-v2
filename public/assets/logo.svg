<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" aria-hidden="true">
  <defs>
    <linearGradient id="apGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="50%" stop-color="#ffb300"/>
      <stop offset="100%" stop-color="#ff8f00"/>
    </linearGradient>
    <linearGradient id="apEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b8a74"/>
      <stop offset="50%" stop-color="#136958"/>
      <stop offset="100%" stop-color="#0a4639"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e1" stop-opacity="1"/>
      <stop offset="70%" stop-color="#ffe082" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffb300" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Ring (Sunburst / Lotus Petals Frame) -->
  <circle cx="60" cy="60" r="56" fill="url(#apEmerald)" stroke="url(#apGold)" stroke-width="3" filter="url(#shadow)"/>
  <circle cx="60" cy="60" r="51" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="3,3" opacity="0.8"/>
  <circle cx="60" cy="60" r="47" fill="#ffffff"/>

  <!-- Inner Sun Glow -->
  <circle cx="60" cy="60" r="43" fill="url(#sunGlow)"/>

  <!-- Andhra Pradesh Poorna Kumbham / Sacred Kalash Pot Motif -->
  <!-- Base of Kumbham -->
  <ellipse cx="60" cy="85" rx="16" ry="4" fill="#ffb300"/>
  <path d="M44 85 C44 70 76 70 76 85 Z" fill="url(#apGold)" stroke="#d97706" stroke-width="1"/>
  
  <!-- Pot Body -->
  <path d="M41 74 C36 62 48 50 60 50 C72 50 84 62 79 74 C75 82 45 82 41 74 Z" fill="url(#apGold)" stroke="#b45309" stroke-width="1.5"/>
  
  <!-- Pot Neck & Rim -->
  <rect x="50" y="47" width="20" height="4" rx="2" fill="#ff8f00"/>
  <ellipse cx="60" cy="47" rx="10" ry="2.5" fill="#ffd54f" stroke="#b45309" stroke-width="1"/>

  <!-- Coconut & Mango Leaves (Poornakumbham Top) -->
  <!-- Mango Leaves -->
  <path d="M60 47 Q48 36 40 44 Q50 49 57 48 Z" fill="#1b8a74"/>
  <path d="M60 47 Q72 36 80 44 Q70 49 63 48 Z" fill="#1b8a74"/>
  <path d="M60 47 Q52 30 48 35 Q56 42 59 47 Z" fill="#2a9d8f"/>
  <path d="M60 47 Q68 30 72 35 Q64 42 61 47 Z" fill="#2a9d8f"/>
  <path d="M60 47 Q60 26 60 22 Q64 35 60 47 Z" fill="#2a9d8f"/>
  
  <!-- Sacred Coconut -->
  <ellipse cx="60" cy="40" rx="7" ry="9" fill="#8d5b4c" stroke="#5d3a1a" stroke-width="1"/>
  <path d="M57 33 L60 27 L63 33 Z" fill="#6d4c41"/>

  <!-- Health & Wellness Cross Symbol Overlay in Emblem -->
  <g transform="translate(60, 66) scale(0.7)">
    <circle cx="0" cy="0" r="14" fill="#ffffff" stroke="#136958" stroke-width="2"/>
    <!-- Medical Cross -->
    <path d="M-3 -9 H3 V-3 H9 V3 H3 V9 H-3 V3 H-9 V-3 H-3 Z" fill="#d32f2f"/>
  </g>

  <!-- Ashok Chakra 24 Spoke Halo at Top -->
  <g transform="translate(60, 15) scale(0.6)">
    <circle cx="0" cy="0" r="10" fill="none" stroke="#1e3a8a" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="2" fill="#1e3a8a"/>
  </g>

  <!-- Stars of Excellence -->
  <polygon points="26,60 28,64 33,64 29,67 31,72 26,69 22,72 24,67 20,64 25,64" fill="#ffb300"/>
  <polygon points="94,60 96,64 101,64 97,67 99,72 94,69 90,72 92,67 88,64 93,64" fill="#ffb300"/>

  <!-- Banner text: AP GOVT HEALTH -->
  <path id="textArc" d="M22 96 A46 46 0 0 0 98 96" fill="none"/>
  <text font-family="'Noto Sans Telugu', 'Segoe UI', Arial" font-size="7" font-weight="bold" fill="#ffffff">
    <textPath href="#textArc" startOffset="50%" text-anchor="middle">
      ఆంధ్రప్రదేశ్ ప్రభుత్వ ప్రజా ఆరోగ్యం
    </textPath>
  </text>
</svg>
