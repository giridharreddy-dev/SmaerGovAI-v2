name: Deploy Firestore rules

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smartgov-firebase-production-rules
  cancel-in-progress: false

env:
  FIREBASE_CLI_DISABLE_USAGE: '1'
  FIREBASE_PROJECT: gen-lang-client-0256394743

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Confirm the production database target
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import assert from "node:assert/strict";
            const read = path => JSON.parse(readFileSync(path, "utf8"));
            const app = read("firebase-applet-config.json");
            assert.equal(app.projectId, process.env.FIREBASE_PROJECT);
            assert.equal(app.firestoreDatabaseId, "(default)");
            assert.deepEqual(read("firebase.json").firestore, [{ database: app.firestoreDatabaseId, rules: "firestore.rules" }]);
          '
      - name: Test Firestore rules and checklist merges
        run: |
          npm install --prefix "$RUNNER_TEMP/firestore-test" --no-audit --no-fund firebase-tools@15.35.0 firebase@13.2.0 @firebase/rules-unit-testing@6.0.0
          python -m pip install -r scripts/requirements-firestore.txt
          export NODE_PATH="$RUNNER_TEMP/firestore-test/node_modules"
          "$RUNNER_TEMP/firestore-test/node_modules/.bin/firebase" emulators:exec --project demo-smartgov --only firestore 'node --test tests/firestore-rules.node.mjs tests/schemeCatalog.node.mjs && python -m unittest discover -s tests -p test_firestore_repository.py'

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: firebase-production
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install Firebase CLI
        run: npm install --prefix "$RUNNER_TEMP/firebase-cli" --no-audit --no-fund firebase-tools@15.35.0
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.FIREBASE_PROJECT }}
          workload_identity_provider: ${{ vars.FIREBASE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
      - name: Deploy only Firestore rules
        run: |
          "$RUNNER_TEMP/firebase-cli/node_modules/.bin/firebase" deploy --project "$FIREBASE_PROJECT" --config firebase.json --only firestore:rules --non-interactive
